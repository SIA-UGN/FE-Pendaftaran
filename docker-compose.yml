version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fe-sia
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      - APP_URL=${APP_URL:-http://localhost:8000}
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
